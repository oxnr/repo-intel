name: Test repo-intel
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          repos: 'oxnr/repo-intel'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-format: json
          period-days: '7'
